name: android-apk

# Builds the user-friendly AirQR Android app on every push to the app code.
# No Android Studio needed: download the APK from the run's Artifacts,
# copy it to the phone over USB, tap to install. Fully offline after that.
on:
  push:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # No Gradle wrapper in repo: install a pinned Gradle directly.
      # AGP 8.5.0 requires Gradle 8.7+ and JDK 17 (provided above).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p mobile/android assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AirQR-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
