[project]
name = "airqr"
version = "1.0.0"
description = "Offline QR-code file transfer"
requires-python = ">=3.10"
dependencies = [
  "opencv-python>=4.8.0",
  "qrcode[pil]>=7.4",
  "Pillow>=10.0.0",
  "numpy>=1.24",
  "zstandard>=0.22",
  "cryptography>=42.0",
  "argon2-cffi>=23.1",
  "reedsolo>=1.7",
]

[project.scripts]
airqr = "main:main"
